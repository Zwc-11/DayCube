[project]
name = "daycube-capture-win"
version = "0.1.0"
description = "Opt-in local browser event receiver; native recording is not implemented yet"
requires-python = ">=3.11,<3.14"
dependencies = ["daycube-ingest", "pyyaml>=6,<7"]

[project.optional-dependencies]
windows = [
  "pywin32>=308; sys_platform == 'win32'", "psutil>=6,<8", "mss>=10,<11",
  "pillow>=11,<13", "pystray>=0.19,<1", "pynput>=1.8,<2"
]
ocr = ["rapidocr-onnxruntime>=1.4,<2", "rapidfuzz>=3,<4"]
gaze = ["mediapipe>=0.10,<1", "opencv-python>=4.10,<5", "scikit-learn>=1.6,<2"]

[tool.uv]
package = true

[tool.uv.sources]
daycube-ingest = { path = "../ingest", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture"]
