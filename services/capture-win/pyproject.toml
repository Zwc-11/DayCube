[project]
name = "daycube-capture-win"
version = "0.1.0"
description = "DayCube capture receiver: browser records and gaze into the local vault, dwell detection, autostart"
requires-python = ">=3.11,<3.14"
dependencies = [
  "daycube-ingest", "pyyaml>=6,<7",
  # Reading the window under the gaze in any app (capture/screen.py): its pixels, and Windows' own OCR.
  "mss>=10,<11; sys_platform == 'win32'",
  "winrt-runtime>=3,<5; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=3; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=3; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3; sys_platform == 'win32'",
  # A scan's mesh, made by the receiver's job thread (ingest/splat/mesh.py): 77 MB on Windows.
  "open3d>=0.19,<0.21",
]

[project.optional-dependencies]
windows = [
  "pywin32>=308; sys_platform == 'win32'", "psutil>=6,<8", "mss>=10,<11",
  "pillow>=11,<13", "pystray>=0.19,<1", "pynput>=1.8,<2"
]
ocr = ["rapidocr-onnxruntime>=1.4,<2", "rapidfuzz>=3,<4"]

[tool.uv]
package = true

[tool.uv.sources]
daycube-ingest = { path = "../ingest", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The parent repository ignores /capture/ runtime data. It must not hide this Python package.
# Both distribution targets explicitly limit their contents below.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["capture"]

[tool.hatch.build.targets.sdist]
only-include = ["capture", "pyproject.toml"]
