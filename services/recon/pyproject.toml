[project]
name = "daycube-recon"
version = "0.1.0"
description = "Walks rebuilt from images with learned features (ALIKED + LightGlue on the GPU): eval/glasses_sim.py --features aliked"
requires-python = ">=3.11,<3.13"
# Its own environment, like services/speech: PyTorch with CUDA 12.8 (the RTX 5070's sm_120) is not
# what the receiver needs. The same torch as services/speech, so uv links it from its cache.
dependencies = [
  "daycube-ingest",
  "torch==2.9.1",
  "kornia>=0.8,<1",        # ALIKED, LightGlue (Apache-2.0)
  "pycolmap>=4.2,<5",      # COLMAP: verification, mapping (BSD)
  "pillow>=11,<13",
  "numpy>=1.26,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.uv.sources]
daycube-ingest = { path = "../ingest", editable = true }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
