[project]
name = "daycube-speech"
version = "0.1.0"
description = "Speech in DayCube recordings: where people speak, what they say with word times (Qwen3-ASR), who said it, how it sounded, run as jobs leased from the capture receiver"
requires-python = ">=3.11,<3.13"
# Its own project, like services/gaze: qwen-asr pins transformers and accelerate, and the GPU
# build of PyTorch (CUDA 12.8, the RTX 5070's sm_120) is not what the rest of DayCube needs.
dependencies = [
  "torch>=2.7,<2.10",
  "torchaudio>=2.7,<2.10",
  "qwen-asr==0.0.6",       # Qwen3-ASR and Qwen3-ForcedAligner (Apache-2.0)
  "funasr>=1.2,<2",        # CAM++ speaker embeddings, emotion2vec+, SenseVoice
  "silero-vad>=6,<7",
  "scikit-learn>=1.6,<2",
  "soundfile>=0.12",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
