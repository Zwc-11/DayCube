[project]
name = "daycube-gaze"
version = "0.1.0"
description = "Webcam eye tracking for DayCube: EyeTrax gaze, fixations sent to the local capture receiver"
requires-python = ">=3.11,<3.13"
# EyeTrax (MIT) pins numpy<2, which the rest of DayCube cannot use, so this is its own project.
dependencies = ["eyetrax==0.4.0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
