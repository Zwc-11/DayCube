[project]
name = "daycube-ingest"
version = "0.1.0"
description = "DAYCUBE local vault, ingestion and retrieval API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "jsonschema-rs>=0.58.5,<0.59",
  "httpx>=0.28,<1",
  "tzdata>=2025.2",
  "zstandard>=0.23,<1",
  "numpy>=2,<3"
]

[project.scripts]
daycube = "ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]
