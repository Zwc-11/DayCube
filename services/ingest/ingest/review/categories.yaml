# The built-in category rules of the day timeline (ingest/review/labels.py).
#
# vault/categories.yaml has the same form; its rules are tried first, so a rule there overrides
# these. The first rule that matches decides. A rule matches when any of its conditions does:
#
#   apps:    the program in front ("code.exe") or its name ("Visual Studio Code")
#   sites:   a page's domain, subdomains included ("youtube.com" matches m.youtube.com); a path
#            after it narrows the rule ("linkedin.com/jobs"); * is any text ("*.myworkdayjobs.com")
#   titles:  a word or phrase in the window or page title, any case
#   courses: true, a course code such as "CS 136" in the title
#
# Order matters: strong signals (the meeting app, the editor) come before title words, title words
# before sites, so a lecture on YouTube is studying and an assignment open in the editor is coding.

rules:
  - category: meetings
    apps: [zoom.exe, ms-teams.exe, teams.exe, webex.exe, ciscocollabhost.exe]
    sites: [meet.google.com, zoom.us, teams.microsoft.com, teams.live.com, webex.com]

  - category: coding
    apps: [
      code.exe, "code - insiders.exe", cursor.exe, kiro.exe, windsurf.exe, antigravity.exe, zed.exe,
      devenv.exe, pycharm64.exe, idea64.exe, webstorm64.exe, clion64.exe, rider64.exe, goland64.exe,
      datagrip64.exe, studio64.exe, sublime_text.exe, windowsterminal.exe, wt.exe, powershell.exe,
      pwsh.exe, cmd.exe, conhost.exe, mintty.exe, githubdesktop.exe, rstudio.exe, matlab.exe,
      docker desktop.exe, postman.exe, dbeaver.exe,
    ]

  - category: studying
    courses: true
    titles: [lecture, tutorial, midterm, final exam, homework, problem set, syllabus, course notes]
    sites: [
      learn.uwaterloo.ca, piazza.com, edstem.org, crowdmark.com, gradescope.com, gradescope.ca,
