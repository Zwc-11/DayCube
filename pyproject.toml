[project]
name = "daycube"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["daycube-ingest"]

[project.optional-dependencies]
ai = ["anthropic>=0.72,<1"]
vector = ["fastembed>=0.7,<1"]
modal = ["modal>=1,<2"]
skeleton = ["scikit-learn>=1.6,<2", "numpy>=2,<3"]
moments = ["pillow>=11,<13", "trimesh>=4,<5", "numpy>=2,<3"]
transcribe = ["faster-whisper>=1.2,<2"]  # voice memos from the phone (docs/phone.md)
mesh = ["open3d>=0.19,<0.21"]  # a scan's surface as a mesh, from its LiDAR depth (docs/splat.md)

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "datamodel-code-generator>=0.35,<1"]

[tool.uv.sources]
daycube-ingest = { workspace = true }

[tool.uv.workspace]
members = ["services/ingest"]
exclude = ["services/capture-win", "services/gaze", "services/speech"]

[tool.pytest.ini_options]
testpaths = ["services/ingest/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# The DeepInfer rule set: pycodestyle, Pyflakes, pyupgrade, bugbear, simplify, isort, annotations.
select = ["E", "F", "UP", "B", "SIM", "I", "ANN"]
ignore = [
  "E501",   # line length is the formatter's job
  "ANN202", # private helpers may infer their return type
  "ANN401", # JSON records are genuinely Any at the boundary
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as call defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"services/ingest/ingest/generated/*" = ["I", "UP", "ANN"]
