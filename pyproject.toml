[project]
name = "daycube"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["daycube-ingest"]

[project.optional-dependencies]
ai = ["anthropic>=0.72,<1"]
vector = ["fastembed>=0.7,<1", "sqlite-vec>=0.1.6,<1"]
modal = ["modal>=1,<2"]
skeleton = ["scikit-learn>=1.6,<2", "numpy>=2,<3"]
moments = ["pillow>=11,<13", "trimesh>=4,<5", "numpy>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "datamodel-code-generator>=0.35,<1"]

[tool.uv.sources]
daycube-ingest = { workspace = true }

[tool.uv.workspace]
members = ["services/ingest"]
exclude = ["services/capture-win"]

[tool.pytest.ini_options]
testpaths = ["services/ingest/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"services/ingest/ingest/generated/*" = ["I"]
