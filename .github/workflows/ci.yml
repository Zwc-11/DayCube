name: DAYCUBE checks
on: [push, pull_request]
jobs:
  contracts-and-api:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
          enable-cache: true
      - run: uv sync --locked --python 3.11
      - run: npm ci
      - run: npm run lint:api
      - run: npm run test:api
      - run: uv run python scripts/check-capture-package.py
      - run: uv sync --locked --project services/capture-win --python 3.11
      - run: uv run --project services/capture-win python -m capture --help
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:e2e:api
      - if: runner.os == 'Linux'
        run: npm run test:e2e:viewer
